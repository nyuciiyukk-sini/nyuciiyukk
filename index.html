<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NyuciYuk - Direktori Laundry Terdekat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">

  <!-- Header -->
  <header class="max-w-4xl mx-auto mb-8 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-blue-600">NyuciYuk 🧺</h1>
      <p class="text-gray-600 mt-1">Cari & Hubungi Laundry Terdekat Cuma Sekali Klik</p>
    </div>
    <!-- Tombol Khusus Admin -->
    <a href="admin.html" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-200 transition">
      + Input Data (Admin)
    </a>
  </header>

  <!-- Tempat Menampilkan Kartu Laundry -->
  <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6" id="laundry-list">
  </main>

  <script>
    // Membaca data yang diinput dari admin.html
    const dataLaundry = JSON.parse(localStorage.getItem('nyuciYukData')) || [];
    const container = document.getElementById('laundry-list');

    if (dataLaundry.length === 0) {
      container.innerHTML = `
        <div class="col-span-2 text-center py-12 bg-white rounded-xl shadow border">
          <p class="text-gray-500 font-medium">Belum ada data laundry yang dimasukkan.</p>
          <a href="admin.html" class="inline-block mt-3 text-blue-600 font-bold hover:underline">Klik di sini untuk mengisi data lewat Admin.html</a>
        </div>
      `;
    } else {
      dataLaundry.forEach(item => {
        container.innerHTML += `
          <div class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden flex flex-col justify-between">
            
            <!-- Foto Tempat Laundry -->
            <img src="${item.foto}" alt="${item.nama}" class="w-full h-48 object-cover">
            
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold mb-2">${item.wilayah}</span>
                <h2 class="text-xl font-bold text-gray-800">${item.nama}</h2>
                <p class="text-green-600 font-bold mt-1">${item.harga}</p>
                <p class="text-sm text-gray-600 mt-2">✨ ${item.layanan}</p>
                
                <!-- Informasi Tambahan (Ulasan, IG, Web) -->
                <div class="mt-3 pt-3 border-t text-xs text-gray-500 space-y-1">
                  <p>💬 <b>Ulasan:</b> ${item.ulasan}</p>
                  <p>📷 <b>IG:</b> ${item.instagram}</p>
                  ${item.website !== '#' ? `<p>🌐 <b>Web:</b> <a href="${item.website}" target="_blank" class="text-blue-500 underline">Kunjungi Website</a></p>` : ''}
                </div>
              </div>

              <!-- Tombol Aksi (WA & Maps) -->
              <div class="mt-5 flex gap-2">
                <a href="https://wa.me/${item.whatsapp}?text=Halo%20NyuciYuk,%20mau%20tanya%20jasa%20laundry" target="_blank" class="flex-1 bg-green-500 hover:bg-green-600 text-white text-center py-2 rounded-lg font-medium text-sm transition">Hubungi WA</a>
                <a href="${item.maps}" target="_blank" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium text-sm transition">Maps</a>
              </div>
            </div>

          </div>
        `;
      });
    }
  </script>

</body>
</html>
