<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Tambah Mitra Laundry</title>
  <!-- Tailwind CSS & CDN Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8 text-gray-800">

  <div class="max-w-2xl mx-auto bg-white p-6 md:p-8 rounded-2xl shadow-md border border-gray-100">
    <!-- Header Admin -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold text-blue-600">🧺 Form Admin NyuciYuk</h1>
        <p class="text-xs text-gray-500 mt-1">Tambah data mitra laundry baru langsung ke website</p>
      </div>
      <a href="index.html" class="text-xs bg-gray-100 text-gray-700 px-3 py-2 rounded-xl font-semibold hover:bg-blue-50 hover:text-blue-600 transition flex items-center gap-1">
        <i class="fa-solid fa-eye"></i> Lihat Web Utama
      </a>
    </div>

    <!-- Alert Notifikasi Status Simpan -->
    <div id="alert" class="hidden mb-4 p-4 rounded-xl text-sm font-medium"></div>

    <!-- FORM INPUT KOSONG (TINGGAL KETIK/PASTE) -->
    <form id="laundry-form" class="space-y-4">

      <!-- Nama Laundry -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Nama Tempat Laundry <span class="text-red-500">*</span></label>
        <input type="text" id="name" required placeholder="Contoh: Nyuci Kilat Tembalang" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <!-- No WA & Harga -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Nomor WhatsApp <span class="text-red-500">*</span></label>
          <input type="text" id="phone" required placeholder="6281234567890 (Gunakan kode 62)" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Harga per Kg (Rp)</label>
          <input type="number" id="price" placeholder="6000" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <!-- Alamat -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Alamat Lengkap / Wilayah <span class="text-red-500">*</span></label>
        <input type="text" id="address" required placeholder="Jl. Tembalang Baru No. 12, Semarang Tengah" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <!-- Layanan -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Layanan (Pisahkan Koma)</label>
        <input type="text" id="services" placeholder="Kiloan, Express 3 Jam, Sepatu, Boneka" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <!-- Link Foto -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">URL / Link Foto Laundry 🖼️</label>
        <input type="url" id="image_url" placeholder="https://images.unsplash.com/photo-..." class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        <p class="text-[11px] text-gray-400 mt-1">Copy & paste link alamat gambar dari Google Maps / Internet</p>
      </div>

      <!-- Link Sosmed & Maps -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Link Google Maps 📍</label>
          <input type="url" id="maps_url" placeholder="https://maps.google.com/..." class="w-full border border-gray-300 p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Link Instagram 📷</label>
          <input type="url" id="instagram_url" placeholder="https://instagram.com/..." class="w-full border border-gray-300 p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Link Website 🌐</label>
          <input type="url" id="website_url" placeholder="https://nyucikilat.id" class="w-full border border-gray-300 p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
        </div>
      </div>

      <!-- Rating & Ulasan -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Rating ⭐ (1.0 - 5.0)</label>
          <input type="number" step="0.1" id="rating" placeholder="4.9" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-1">Jumlah Ulasan / Review</label>
          <input type="number" id="reviews_count" placeholder="85" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <!-- Catatan Testimoni -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">Ulasan Singkat / Testimoni Pelanggan 💬</label>
        <textarea id="review_text" rows="2" placeholder="Pelayanan cepat, baju wangi, dan pengerjaan rapi sekali!" class="w-full border border-gray-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
      </div>

      <!-- Tombol Simpan -->
      <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-floppy-disk"></i> Simpan & Tayangkan Data Laundry
      </button>

    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://rzqgnoysthpxgfxscruo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6cWdub3lzdGhweGdmeHNjcnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjMwMjEsImV4cCI6MjEwNzYzOTAyMX0.-6Ces2KK3JBvWBiX-KuN_dyg3NxYzG1nuxg9fhSuir0';
    
    const { createClient } = window.supabase;
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('laundry-form');
    const alertBox = document.getElementById('alert');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.innerText = '⏳ Sedang Menyimpan Data...';
      btnSubmit.disabled = true;

      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        price: document.getElementById('price').value ? parseInt(document.getElementById('price').value) : null,
        address: document.getElementById('address').value,
        services: document.getElementById('services').value || null,
        image_url: document.getElementById('image_url').value || null,
        maps_url: document.getElementById('maps_url').value || null,
        instagram_url: document.getElementById('instagram_url').value || null,
        website_url: document.getElementById('website_url').value || null,
        rating: document.getElementById('rating').value ? parseFloat(document.getElementById('rating').value) : null,
        reviews_count: document.getElementById('reviews_count').value ? parseInt(document.getElementById('reviews_count').value) : null,
        review_text: document.getElementById('review_text').value || null
      };

      const { data, error } = await supabase.from('laundry').insert([payload]);

      if (error) {
        alertBox.className = "mb-4 p-4 rounded-xl text-sm font-medium bg-red-100 text-red-700 block border border-red-200";
        alertBox.innerText = "❌ Gagal menyimpan: " + error.message;
      } else {
        alertBox.className = "mb-4 p-4 rounded-xl text-sm font-medium bg-green-100 text-green-700 block border border-green-200";
        alertBox.innerText = "🎉 Berhasil! Data laundry baru sudah tersimpan dan otomatis tayang di web!";
        form.reset();
      }

      btnSubmit.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan & Tayangkan Data Laundry';
      btnSubmit.disabled = false;
    });
  </script>
</body>
  </html>
