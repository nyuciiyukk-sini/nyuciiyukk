<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NyuciYuk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8 font-sans">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- HEADER ADMIN -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-900 text-white p-6 rounded-2xl shadow-lg gap-4">
      <div>
        <h1 class="text-2xl font-extrabold flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-blue-400"></i> Portal Admin NyuciYuk
        </h1>
        <p class="text-xs text-slate-400 mt-1">Kelola data mitra laundry Semarang secara real-time</p>
      </div>
      <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center gap-2">
        <i class="fa-solid fa-globe"></i> Lihat Web Utama (index.html)
      </a>
    </div>

    <!-- FORM INPUT LAUNDRY BARU -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
      <h2 class="text-lg font-bold mb-4 text-slate-800 border-b pb-2 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-blue-600"></i> Tambah Data Laundry Baru
      </h2>
      
      <form id="formAdminLaundry" onsubmit="handleAdminSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nama Tempat Laundry *</label>
          <input type="text" id="adm-nama" placeholder="Contoh: Barokah Clean Express" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Wilayah / Area *</label>
            <select id="adm-wilayah" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none bg-white">
              <option value="Semarang Tengah">Semarang Tengah (Kampus)</option>
              <option value="Semarang Barat">Semarang Barat (Kos/Hunian)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Harga Layanan Utama *</label>
            <input type="text" id="adm-harga" placeholder="Contoh: Rp 6.000 / kg" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Detail Layanan (Pisahkan Koma) *</label>
          <input type="text" id="adm-layanan" placeholder="Cuci Komplit, Gratis Antar-Jemput, Kilat 1 Hari" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Nomor WhatsApp (Awali 62, misal: 62812345678) *</label>
            <input type="text" id="adm-whatsapp" placeholder="6281234567890" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Link Google Maps *</label>
            <input type="url" id="adm-maps" placeholder="https://maps.google.com/..." required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Website (Opsional)</label>
            <input type="url" id="adm-website" placeholder="https://laundryku.com" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Instagram (Opsional)</label>
            <input type="text" id="adm-instagram" placeholder="@laundryku.smg" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Ulasan / Rating Singkat *</label>
          <input type="text" id="adm-ulasan" placeholder="⭐ 4.9 (120+ ulasan) - Pelayanan ramah & wangi" required class="w-full border border-slate-200 p-2.5 rounded-xl text-xs outline-none" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Foto Tempat Laundry *</label>
          <input type="file" id="adm-fotoFile" accept="image/*" required class="w-full border border-slate-200 p-2 rounded-xl bg-slate-50 text-xs" />
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition text-xs flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Data Laundry
        </button>
      </form>
    </div>

    <!-- WADAH DAFTAR LAUNDRY & TOMBOL HAPUS -->
    <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-blue-600"></i> Daftar Laundry Tersimpan
        </h2>
        <span id="totalBadge" class="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full text-xs">
          Total: 0 Data
        </span>
      </div>

      <!-- Container tempat render data -->
      <div id="adminLaundryList" class="space-y-4"></div>
    </div>

  </div>

  <script>
    // 1. Ambil data dari LocalStorage pakai key 'nyuciYukData'
    function getStoredData() {
      const stored = localStorage.getItem("nyuciYukData");
      return stored ? JSON.parse(stored) : [];
    }

    // 2. Simpan data ke LocalStorage
    function saveDataToStorage(data) {
      localStorage.setItem("nyuciYukData", JSON.stringify(data));
    }

    // 3. Tampilkan daftar laundry + Tombol Hapus di Admin
    function renderAdminList() {
      const container = document.getElementById("adminLaundryList");
      const badge = document.getElementById("totalBadge");
      const dataList = getStoredData();

      badge.textContent = `Total: ${dataList.length} Data`;

      if (dataList.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 italic text-xs">
            Belum ada data laundry. Silakan isi formulir di atas untuk menambah data!
          </div>`;
        return;
      }

      container.innerHTML = dataList.map((item, index) => `
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border border-slate-200 p-4 rounded-xl bg-slate-50 hover:bg-slate-100 transition gap-4">
          <div class="flex items-center gap-4">
            <img src="${item.foto}" alt="${item.nama}" class="w-16 h-16 object-cover rounded-lg border bg-slate-200 flex-shrink-0" onerror="this.src='https://images.unsplash.com/photo-1545173168-9f1947eebb7f?w=600&auto=format&fit=crop&q=80'">
            <div>
              <h3 class="font-bold text-sm text-slate-800">${item.nama}</h3>
              <div class="flex flex-wrap gap-2 text-[11px] text-slate-600 mt-1">
                <span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200">📍 ${item.wilayah}</span>
                <span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200">💰 ${item.harga}</span>
                <span class="bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200">📱 +${item.whatsapp}</span>
              </div>
            </div>
          </div>
          <button onclick="deleteLaundry(${index})" class="bg-red-500 hover:bg-red-600 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 self-end sm:self-center">
            <i class="fa-solid fa-trash-can"></i> Hapus
          </button>
        </div>
      `).join('');
    }

    // 4. Tambah Data Baru
    function handleAdminSubmit(e) {
      e.preventDefault();
      const fileInput = document.getElementById("adm-fotoFile");
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const hargaRaw = document.getElementById("adm-harga").value;
          const numericHarga = parseInt(hargaRaw.replace(/[^0-9]/g, "")) || 6000;

          const newMitra = {
            nama: document.getElementById("adm-nama").value,
            wilayah: document.getElementById("adm-wilayah").value,
            harga: hargaRaw,
            layanan: document.getElementById("adm-layanan").value,
            whatsapp: document.getElementById("adm-whatsapp").value,
            maps: document.getElementById("adm-maps").value,
            website: document.getElementById("adm-website").value || "#",
            instagram: document.getElementById("adm-instagram").value || "-",
            ulasan: document.getElementById("adm-ulasan").value,
            foto: event.target.result,
            ratingVal: 4.9,
            hargaVal: numericHarga,
          };

          const currentData = getStoredData();
          currentData.unshift(newMitra);
          saveDataToStorage(currentData);

          alert("✅ Berhasil menambah data laundry baru!");
          document.getElementById("formAdminLaundry").reset();
          renderAdminList();
        };
        reader.readAsDataURL(file);
      }
    }

    // 5. Hapus Data Laundry Berdasarkan Index
    function deleteLaundry(index) {
      const currentData = getStoredData();
      const nama = currentData[index].nama;

      if (confirm(`Apakah kamu yakin ingin menghapus "${nama}"?`)) {
        currentData.splice(index, 1);
        saveDataToStorage(currentData);
        renderAdminList();
        alert("🗑️ Data laundry berhasil dihapus!");
      }
    }

    window.onload = function () {
      renderAdminList();
    };
  </script>
</body>
</html>
